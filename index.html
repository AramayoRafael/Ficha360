<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ficha 360° — Emprender para crecer y fortalecer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --prim:#A78BFA; --prim-osc:#C4B5FD; --prim2:#8B5CF6; --acento:#F472B6;
  --lila:rgba(139,92,246,.16); --lila2:rgba(139,92,246,.34);
  --verde:#34D399; --verde-bg:rgba(52,211,153,.15);
  --amarillo:#FBBF24; --amarillo-bg:rgba(251,191,36,.15);
  --rojo:#F87171; --rojo-bg:rgba(248,113,113,.15);
  --grisc:#9CA3AF; --grisc-bg:rgba(156,163,175,.15);
  --tinta:#F4F1FF; --gris:#B4A9D6; --borde:rgba(255,255,255,.12); --fondo:#0E0620;
  --vidrio:rgba(255,255,255,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--tinta);min-height:100vh;
  background:#0E0620;
  background-image:linear-gradient(165deg,#160A33 0%,#1E0B45 40%,#2A0E56 75%,#3B1170 100%);
  background-attachment:fixed}
.orbes{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:deriva 18s ease-in-out infinite alternate}
.orb.o1{width:360px;height:360px;background:radial-gradient(circle,#7C3AED,transparent 70%);top:-90px;left:-110px}
.orb.o2{width:320px;height:320px;background:radial-gradient(circle,#DB2777,transparent 70%);bottom:-70px;right:-90px;animation-duration:23s;animation-delay:-6s}
.orb.o3{width:280px;height:280px;background:radial-gradient(circle,#2563EB,transparent 70%);top:38%;left:58%;opacity:.3;animation-duration:27s;animation-delay:-11s}
@keyframes deriva{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}100%{transform:translate(-30px,35px) scale(.94)}}
.chispa{position:absolute;color:rgba(255,255,255,.5);animation:parpadeo 6s ease-in-out infinite;text-shadow:0 0 8px rgba(196,181,253,.8)}
.chispa.c1{top:16%;left:12%;font-size:13px}
.chispa.c2{top:32%;right:9%;font-size:17px;animation-delay:-1.6s}
.chispa.c3{bottom:24%;left:16%;font-size:11px;animation-delay:-3.1s}
.chispa.c4{bottom:11%;right:20%;font-size:15px;animation-delay:-4.2s}
.chispa.c5{top:58%;left:6%;font-size:14px;animation-delay:-2.4s}
@keyframes parpadeo{0%,100%{opacity:.12;transform:translateY(0) scale(.9)}50%{opacity:.8;transform:translateY(-14px) scale(1.15)}}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
header{background:linear-gradient(120deg,rgba(59,7,100,.92),rgba(109,40,217,.88),rgba(162,28,175,.88),rgba(109,40,217,.88));
  background-size:300% 300%;animation:grad 12s ease infinite;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.10);
  box-shadow:0 6px 26px rgba(0,0,0,.45)}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
header .logo{font-size:23px;filter:drop-shadow(0 0 8px rgba(244,114,182,.7));animation:flota 3.5s ease-in-out infinite}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
header .t1{font-size:15.5px;font-weight:800;letter-spacing:.2px;line-height:1.15}
header .t2{font-size:10.5px;opacity:.8;font-weight:500}
header .gear{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;
  font-size:16px;border-radius:12px;padding:7px 10px;cursor:pointer;transition:.2s}
header .gear:hover{background:rgba(255,255,255,.24);transform:rotate(30deg)}
#barra{height:7px;background:rgba(255,255,255,.09);position:relative;overflow:hidden}
#barra-fill{height:100%;width:0;background:linear-gradient(90deg,#8B5CF6,#F472B6);transition:width .45s cubic-bezier(.4,0,.2,1);
  position:relative;border-radius:0 6px 6px 0;box-shadow:0 0 12px rgba(244,114,182,.6)}
#barra-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:brillo 1.8s linear infinite}
@keyframes brillo{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
main{flex:1;padding:22px 18px 122px}
.pantalla{animation:ap .34s cubic-bezier(.22,1,.36,1)}
@keyframes ap{from{opacity:0;transform:translateY(15px) scale(.99)}to{opacity:1;transform:none}}
.paso-num{display:inline-block;font-size:11px;color:var(--prim-osc);font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  background:var(--lila);border:1px solid rgba(167,139,250,.35);border-radius:99px;padding:5px 13px;margin-bottom:12px}
h2{font-size:21px;line-height:1.3;margin-bottom:8px;font-weight:800;letter-spacing:-.2px;color:#fff}
h3{font-size:15px;font-weight:800;color:#fff;margin:18px 0 8px}
.ayuda{font-size:13.5px;color:var(--gris);margin-bottom:16px;line-height:1.55}
.nota{background:rgba(255,255,255,.05);border:1px solid var(--borde);border-left:4px solid var(--prim2);
  border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.6;color:#E4DEF7;margin-bottom:16px}
.nota b{color:var(--prim-osc)}
.opt{display:block;width:100%;text-align:left;background:var(--vidrio);border:1.5px solid var(--borde);border-radius:16px;
  padding:15px 16px;margin-bottom:11px;font-size:14.5px;cursor:pointer;transition:all .18s;font-family:inherit;
  color:var(--tinta);backdrop-filter:blur(12px);box-shadow:0 4px 16px rgba(0,0,0,.25);position:relative}
.opt:hover{border-color:rgba(167,139,250,.6);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:#A78BFA;background:linear-gradient(135deg,rgba(139,92,246,.30),rgba(236,72,153,.18));
  box-shadow:0 0 0 1px rgba(167,139,250,.4),0 10px 30px rgba(139,92,246,.35)}
.opt.sel::after{content:'✓';position:absolute;top:11px;right:13px;width:23px;height:23px;border-radius:50%;
  background:linear-gradient(135deg,#8B5CF6,#F472B6);color:#fff;font-size:12.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;animation:pop .25s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 12px rgba(244,114,182,.7)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.opt .tit{font-weight:700;display:block;padding-right:26px;color:#fff}
.opt .desc{font-size:12.5px;color:var(--gris);display:block;margin-top:3px;line-height:1.45}
.opt .nivel{display:inline-block;font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:99px;margin-bottom:7px;letter-spacing:.3px}
.opt .nivel.n1{background:var(--rojo-bg);color:var(--rojo)}
.opt .nivel.n2{background:var(--amarillo-bg);color:var(--amarillo)}
.opt .nivel.n3{background:var(--verde-bg);color:var(--verde)}
.nsnrna{display:flex;gap:8px;margin:2px 0 10px}
.mini-opt{flex:1;background:rgba(255,255,255,.04);border:1.5px solid var(--borde);border-radius:12px;padding:11px 6px;
  font-size:12.5px;font-weight:700;color:var(--gris);cursor:pointer;font-family:inherit;transition:.16s;text-align:center}
.mini-opt:hover{border-color:rgba(167,139,250,.5)}
.mini-opt.sel{border-color:var(--grisc);background:var(--grisc-bg);color:#E5E7EB}
input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--borde);border-radius:14px;
  padding:13px 14px;font-size:16px;font-family:inherit;background:rgba(255,255,255,.07);color:#fff;transition:border .2s;backdrop-filter:blur(10px)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23B4A9D6' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
select option{background:#241147;color:#fff}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.32)}
textarea{min-height:84px;resize:vertical;font-size:15px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#A78BFA;box-shadow:0 0 0 4px rgba(139,92,246,.2)}
.campo{margin-bottom:15px}
.campo label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#E4DEF7;line-height:1.4}
.campo .cod{display:inline-block;font-size:10.5px;font-weight:800;color:var(--prim-osc);background:var(--lila);
  border-radius:6px;padding:2px 7px;margin-right:6px}
.campo .hint{font-size:11.5px;color:var(--gris);margin-top:5px;line-height:1.4}
.dual{display:flex;gap:10px}
.dual>div{flex:1}
.dual .sub{font-size:11px;color:var(--gris);margin-bottom:4px;display:block}
.evid{margin-top:12px}
.evid label{font-size:12px;font-weight:700;color:var(--prim-osc);display:block;margin-bottom:5px}
.evid input{font-size:14px;padding:11px 13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,6,32,.85);backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.09);padding:11px 18px calc(11px + env(safe-area-inset-bottom));z-index:9}
.nav-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:15px;padding:15px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:.2px}
.btn-p{background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff;box-shadow:0 6px 22px rgba(236,72,153,.45)}
.btn-p:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 30px rgba(236,72,153,.55)}
.btn-p:disabled{background:rgba(255,255,255,.13);box-shadow:none;cursor:not-allowed;color:rgba(255,255,255,.45)}
.btn-s{background:rgba(255,255,255,.06);color:var(--prim-osc);border:1.5px solid rgba(167,139,250,.45);flex:0 0 auto;padding:15px 18px;backdrop-filter:blur(10px)}
.btn-s:hover{border-color:#A78BFA;background:rgba(139,92,246,.15)}
.btn-g{background:linear-gradient(135deg,#059669,#10B981);color:#fff;box-shadow:0 6px 22px rgba(16,185,129,.4)}
.btn-r{background:linear-gradient(135deg,#DC2626,#EF4444);color:#fff;box-shadow:0 6px 22px rgba(239,68,68,.4)}
.tarjeta{background:var(--vidrio);border:1px solid var(--borde);border-radius:20px;padding:18px;margin-bottom:15px;
  backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(0,0,0,.35)}
.centrado{text-align:center}
.big-emoji{font-size:54px;text-align:center;margin:10px 0;animation:flota 3s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(244,114,182,.5))}
.codigo-tag{display:inline-block;background:linear-gradient(135deg,var(--lila),var(--lila2));color:var(--prim-osc);
  border:1px solid rgba(167,139,250,.4);font-weight:800;border-radius:9px;padding:4px 11px;font-size:12px;letter-spacing:.4px}
.alerta{background:rgba(251,191,36,.13);border:1px solid rgba(251,191,36,.3);color:#FDE68A;border-radius:13px;padding:12px 14px;font-size:13px;margin:12px 0;line-height:1.55}
.ok-envio{background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.35);border-radius:13px;padding:14px;font-size:13.5px;margin:12px 0;text-align:center;font-weight:700;color:#6EE7B7}
.err-envio{background:rgba(248,113,113,.13);border:1px solid rgba(248,113,113,.35);border-radius:13px;padding:14px;font-size:13.5px;margin:12px 0;text-align:center;color:#FCA5A5}
.mini{font-size:11.5px;color:rgba(255,255,255,.42);margin-top:16px;text-align:center;line-height:1.6}
.fase-btn{display:flex;align-items:center;gap:15px}
.fase-btn .ic{font-size:30px}
.fase-btn .tx b{display:block;font-size:15.5px;margin-bottom:2px;color:#fff}
.fase-btn .tx span{font-size:12.5px;color:var(--gris)}
.spinner{display:inline-block;width:17px;height:17px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
label.lbl{display:block;font-size:12.5px;font-weight:800;margin:14px 0 7px;color:var(--prim-osc)}
/* filas Sí/No y estados */
.fila-sn{background:var(--vidrio);border:1px solid var(--borde);border-radius:14px;padding:13px 14px;margin-bottom:11px}
.fila-sn .txt{font-size:13.5px;font-weight:600;color:#fff;margin-bottom:9px;line-height:1.4}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:1.5px solid var(--borde);background:rgba(255,255,255,.04);border-radius:99px;padding:8px 15px;
  font-size:12.5px;font-weight:700;color:var(--gris);cursor:pointer;font-family:inherit;transition:.16s}
.pill:hover{border-color:rgba(167,139,250,.5)}
.pill.sel{border-color:#A78BFA;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(236,72,153,.2));color:#fff}
.pill.sel.si-alerta{border-color:var(--rojo);background:var(--rojo-bg);color:#FCA5A5}
.pill.sel.ok{border-color:var(--verde);background:var(--verde-bg);color:#6EE7B7}
.escala5{display:flex;gap:6px;margin-top:8px}
.escala5 .pill{flex:1;text-align:center;padding:10px 0}
/* priorización */
.prio-card{background:var(--vidrio);border:1px solid var(--borde);border-radius:16px;padding:15px;margin-bottom:14px}
.prio-card .num{font-size:11px;font-weight:800;color:var(--prim-osc);letter-spacing:.7px;text-transform:uppercase;margin-bottom:8px}
.crit-fila{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.crit-fila .cn{flex:1;font-size:12.5px;color:#E4DEF7;font-weight:600}
.crit-fila .cp{display:flex;gap:5px}
.crit-fila .cp button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--borde);background:rgba(255,255,255,.04);
  color:var(--gris);font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.crit-fila .cp button.sel{border-color:#A78BFA;background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff}
.total-prio{text-align:right;font-size:13px;font-weight:800;color:var(--prim-osc);margin-top:6px}
/* resultados */
.anillo-wrap{display:flex;justify-content:center;margin:6px 0 2px}
.anillo{position:relative;width:150px;height:150px;filter:drop-shadow(0 0 18px rgba(139,92,246,.45))}
.anillo svg{transform:rotate(-90deg)}
.anillo .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anillo .num b{font-size:31px;letter-spacing:-1px;color:#fff}
.anillo .num span{font-size:10.5px;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.sem-card{background:var(--vidrio);border:1px solid var(--borde);border-radius:18px;padding:16px;margin-bottom:13px;
  backdrop-filter:blur(12px);box-shadow:0 10px 28px rgba(0,0,0,.32);
  border-left:6px solid var(--borde);opacity:0;animation:sube .55s cubic-bezier(.22,1,.36,1) forwards}
@keyframes sube{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sem-card.ROJO{border-left-color:#F87171}
.sem-card.AMARILLO{border-left-color:#FBBF24}
.sem-card.VERDE{border-left-color:#34D399}
.sem-card.GRIS{border-left-color:#9CA3AF}
.sem-top{display:flex;align-items:center;gap:12px}
.sem-luz{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sem-luz.ROJO{background:var(--rojo-bg);border:1px solid rgba(248,113,113,.35)}
.sem-luz.AMARILLO{background:var(--amarillo-bg);border:1px solid rgba(251,191,36,.35)}
.sem-luz.VERDE{background:var(--verde-bg);border:1px solid rgba(52,211,153,.4);animation:glow 2.2s ease-in-out infinite}
.sem-luz.GRIS{background:var(--grisc-bg);border:1px solid rgba(156,163,175,.35)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}50%{box-shadow:0 0 0 8px rgba(52,211,153,.14)}}
.sem-nombre{font-weight:800;font-size:15px;color:#fff;line-height:1.25}
.sem-estado{font-size:12px;font-weight:800;margin-top:2px}
.sem-estado.ROJO{color:var(--rojo)}
.sem-estado.AMARILLO{color:var(--amarillo)}
.sem-estado.VERDE{color:var(--verde)}
.sem-estado.GRIS{color:var(--grisc)}
.sem-flecha{font-size:12px;color:var(--gris);font-weight:600;margin-top:3px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 2px}
.dot{font-size:10.5px;font-weight:700;border-radius:99px;padding:4px 9px;line-height:1.2}
.dot.v1{background:var(--rojo-bg);color:var(--rojo)}
.dot.v2{background:var(--amarillo-bg);color:var(--amarillo)}
.dot.v3{background:var(--verde-bg);color:var(--verde)}
.dot.v0{background:var(--grisc-bg);color:var(--grisc)}
.panorama{font-size:13px;line-height:1.6;margin-top:10px;color:#E4DEF7}
.panorama b{color:var(--prim-osc)}
.acciones{margin-top:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:12px 13px}
.acciones .a-tit{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--prim);margin-bottom:7px}
.reco{display:flex;gap:9px;font-size:13px;line-height:1.5;margin-bottom:7px;color:#E4DEF7}
.reco:last-child{margin-bottom:0}
.reco span:first-child{flex-shrink:0}
.alertas-box{background:linear-gradient(135deg,rgba(220,38,38,.22),rgba(139,92,246,.15));border:1px solid rgba(248,113,113,.4);
  border-radius:18px;padding:16px;margin-bottom:15px}
.alertas-box h3{margin:0 0 9px;font-size:14.5px}
.alertas-box .it{display:flex;gap:9px;font-size:13px;line-height:1.5;margin-bottom:7px;color:#FEE2E2;font-weight:600}
.logros{background:linear-gradient(135deg,rgba(236,72,153,.20),rgba(139,92,246,.20));border:1px solid rgba(244,114,182,.3);
  border-radius:18px;padding:17px;margin-bottom:15px;backdrop-filter:blur(12px)}
.logros h3{font-size:14.5px;margin:0 0 10px;color:#fff}
.logro{display:flex;gap:10px;font-size:13.5px;line-height:1.5;margin-bottom:8px;font-weight:600;color:#F4F1FF}
.msj-final{font-size:16px;font-weight:800;text-align:center;margin:14px 0 6px;line-height:1.45;color:#fff}
.resumen-tabla{width:100%;font-size:12.5px;border-collapse:collapse;margin-top:8px}
.resumen-tabla th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);padding:6px 4px;border-bottom:1px solid var(--borde)}
.resumen-tabla td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06);color:#E4DEF7}
.resumen-tabla .c{text-align:center;font-weight:800}

/* ---------- ayuda contextual ---------- */
.fab-ayuda{position:fixed;right:16px;bottom:86px;z-index:20;width:50px;height:50px;border-radius:50%;
  border:1px solid rgba(255,255,255,.25);background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff;
  font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(236,72,153,.5);font-family:inherit;
  display:flex;align-items:center;justify-content:center;animation:latido 3.4s ease-in-out infinite}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.fab-ayuda:active{transform:scale(.93)}
.modal-fondo{position:fixed;inset:0;background:rgba(8,3,20,.78);backdrop-filter:blur(6px);z-index:30;
  display:flex;align-items:flex-end;justify-content:center;animation:aparece .22s ease}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(180deg,#2A1552,#1A0B36);border:1px solid rgba(167,139,250,.35);
  border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:86vh;overflow-y:auto;
  padding:22px 20px calc(26px + env(safe-area-inset-bottom));animation:sube-modal .3s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -12px 40px rgba(0,0,0,.5)}
@keyframes sube-modal{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.modal .asa{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.25);margin:0 auto 16px}
.modal h3{margin:0 0 6px;font-size:18px}

/* ---------------- Cálculo del semáforo ---------------- */
function colorDe(p){ if(p===null||p===undefined) return 'GRIS'; return p<1.67?'ROJO':(p<2.34?'AMARILLO':'VERDE'); }
function emojiDe(c){ return c==='ROJO'?'🔴':c==='AMARILLO'?'🟡':c==='VERDE'?'🟢':'⚪'; }
function textoDe(c){ return c==='ROJO'?'Para reforzar':c==='AMARILLO'?'En camino':c==='VERDE'?'Bien logrado':'Falta información'; }
function hexDe(c){ return c==='ROJO'?'#F87171':c==='AMARILLO'?'#FBBF24':c==='VERDE'?'#34D399':'#9CA3AF'; }
function pref(){ return fase==='expost'?'q_':'p_'; }
/* Regla de suficiencia: se calcula si falta como máximo un ítem de la dimensión
   (equivale a 4 de 5 en las dimensiones de cinco ítems, y 3 de 4 en las de cuatro). */
function minimoValidos(d){ return Math.max(3, d.items.length-1); }

function promDim(d,prefijo){
  const pf=prefijo||pref();
  const vals=d.items.map(it=>R[pf+it.id]).filter(v=>v===1||v===2||v===3);
  const validos=vals.length;
  if(validos<minimoValidos(d)) return {validos, total:d.items.length, prom:null, color:'GRIS'};
  const prom=Math.round(vals.reduce((a,b)=>a+b,0)/validos*100)/100;
  return {validos, total:d.items.length, prom, color:colorDe(prom)};
}
function perfil(prefijo){
  const dims=DIMS.map(d=>Object.assign({dim:d},promDim(d,prefijo)));
  const conValor=dims.filter(x=>x.prom!==null).map(x=>x.prom);
  const general=conValor.length? Math.round(conValor.reduce((a,b)=>a+b,0)/conValor.length*100)/100 : null;
  return {dims, general, colorGeneral:colorDe(general)};
}
function itemsBajos(){
  const pf=pref(), out=[];
  DIMS.forEach(d=>d.items.forEach(it=>{ if(R[pf+it.id]===1) out.push({dim:d,item:it}); }));
  return out;
}

/* ---------------- Datos remotos ----------------
   Las lecturas usan JSONP (etiqueta <script>) en lugar de fetch: asi funcionan
   en cualquier navegador, incluido el interno de WhatsApp, que bloquea la
   lectura de respuestas de otros dominios. */
function jsonp(consulta, segundos){
  return new Promise(function(resolver, rechazar){
    if(!API_URL) return rechazar(new Error('sin URL'));
    const nombre='f360cb'+Math.random().toString(36).slice(2,10);
    const et=document.createElement('script');
    let listo=false;
    const tiempo=setTimeout(function(){ if(!listo){ limpiar(); rechazar(new Error('tiempo agotado')); } },(segundos||20)*1000);
    function limpiar(){
      listo=true; clearTimeout(tiempo);
      try{ delete window[nombre]; }catch(e){ window[nombre]=undefined; }
      if(et.parentNode) et.parentNode.removeChild(et);
    }
    window[nombre]=function(datos){ limpiar(); resolver(datos); };
    et.onerror=function(){ if(!listo){ limpiar(); rechazar(new Error('sin conexion')); } };
    et.src=API_URL+(API_URL.indexOf('?')>=0?'&':'?')+consulta+'&callback='+nombre+'&t='+Date.now();
    document.head.appendChild(et);
  });
}
function navegadorInterno(){
  const u=(navigator.userAgent||'').toLowerCase();
  return /(fban|fbav|instagram|line\/|micromessenger)/.test(u) ||
         (/(wv)/.test(u) && /android/.test(u));
}
async function cargarRoster(){
  if(!API_URL){ROSTER=ROSTER_DEMO;return 'demo';}
  try{
    const j=await jsonp('action=roster');
    if(Array.isArray(j)&&j.length){ROSTER=j;return 'ok';}
    ROSTER=ROSTER_DEMO;return 'vacio';
  }catch(e){ROSTER=ROSTER_DEMO;return 'error';}
}
async function cargarExAnte(){
  if(!API_URL)return;
  try{
    const j=await jsonp('action=exante');
    if(Array.isArray(j))j.forEach(x=>{EXANTE_PREVIO[x.codigo]=x;});
  }catch(e){}
}
/* Pregunta a la base si la ficha quedo guardada */
async function verificarGuardada(codigo,fase){
  try{
    const j=await jsonp('action=verificar&codigo='+encodeURIComponent(codigo)+'&fase='+fase, 25);
    return !!(j&&j.guardada);
  }catch(e){ return null; }
}

function P(tipo,extra){ return Object.assign({tipo},extra||{}); }
function construirPasos(){
  pasos=[];
  pasos.push(P('consent'));
  pasos.push(P('ident'));
  pasos.push(P('base1'));
  pasos.push(P('base2'));
  if(fase==='expost') pasos.push(P('factores'));
  DIMS.forEach(d=>{
    pasos.push(P('dimintro',{dim:d}));
    d.items.forEach(it=>pasos.push(P('item',{dim:d,item:it})));
  });
  if(fase==='expost'){

}

/* Guardar y restaurar el foco tras un redibujado */
function recordarFoco(){
  const el=document.activeElement;
  if(el&&el.dataset&&el.dataset.k) window._foco={k:el.dataset.k,pos:el.selectionStart};
}
function restaurarFoco(){
  const f=window._foco; if(!f)return;
  const el=document.querySelector('[data-k="'+f.k+'"]');
  if(el){ el.focus(); try{ el.setSelectionRange(f.pos,f.pos); }catch(e){} }
  window._foco=null;
}

/* ---------------- Render ---------------- */
function render(mantenerScroll){
  const _y=(typeof window!=='undefined'&&window.scrollY)||0;
  if(mantenerScroll) recordarFoco();
  const vis=pasosVisibles();
  if(idx>=vis.length) idx=vis.length-1;
  const p=vis[idx];
  window._paso=p;
  $('#barra-fill').style.width=Math.round(idx/(vis.length-1)*100)+'%';
  $('#btn-atras').style.display=idx===0?'none':'block';
  guardarDraft();
  nav.style.display='block';
  $('#fab').style.display='flex';
  $('#btn-sig').textContent='Siguiente';
  let h='';
  switch(p.tipo){
    case 'consent': h=vConsent(); break;
    case 'ident': h=vIdent(); break;
    case 'base1': h=vBase(0,7); break;
    case 'base2': h=vBase(7,13); break;
    case 'factores': h=vFactores(); break;
    case 'dimintro': h=vDimIntro(p.dim); break;
    case 'item': h=vItem(p.dim,p.item); break;
    case 'autonomia': h=vAutonomia(); break;
    case 'valoracion': h=vValoracion(); break;
    case 'resultado': renderResultado(); return;
  }
  main.innerHTML='<div class="pantalla">'+h+'</div>';
  actualizarSig();
  if(mantenerScroll){ window.scrollTo(0,_y); restaurarFoco(); } else window.scrollTo(0,0);
}

function idImplementacion(){
  const m=/\/macros\/s\/([^/]+)\//.exec(API_URL||'');
  if(!m) return '(sin URL)';
  const id=m[1];
  return id.slice(0,6)+'…'+id.slice(-8);
}
function origenURL(){
  return localStorage.getItem(LSKEY_URL)?'guardada en este equipo':'la del archivo';
}
async function comprobarConexionInicio(){
  const el=document.getElementById('estado-con');
  if(!el)return;
  if(!API_URL){ el.innerHTML='Versión '+VERSION_INSTRUMENTO+' · ⚠️ Modo prueba sin base de datos'; return; }
  const pie='<br><span style="opacity:.7">Base: '+idImplementacion()+' ('+origenURL()+')</span>';
  try{
    const j=await jsonp('action=ping',15);
    if(j&&j.status==='ok'){ el.innerHTML='Versión '+VERSION_INSTRUMENTO+' · ✅ Conectado a la base de datos'+pie; return; }
    throw new Error('respuesta inesperada');
  }catch(e){
    el.innerHTML='Versión '+VERSION_INSTRUMENTO+' · ⚠️ Sin conexión con la base'+pie+
      '<br><button class="btn btn-s" style="width:100%;margin-top:10px;padding:11px" onclick="olvidarURL()">🧹 Usar la dirección del archivo</button>';
  }
}
/* Borra la URL guardada en el equipo para volver a la del archivo */
function olvidarURL(){
  localStorage.removeItem(LSKEY_URL);

}
function retomarDraft(){
  try{

    construirPasos();idx=Math.min(d.idx,pasos.length-1);

         <div><span class="sub">Cantidad</span><input type="number" inputmode="decimal" data-k="b_${b.id}" value="${R['b_'+b.id]??''}" oninput="setCampo('b_${b.id}',this.value===''?null:Number(this.value))"></div>
         <div><span class="sub">Unidad</span><input type="text" data-k="b_${b.id}_u" value="${esc(R['b_'+b.id+'_u']||'')}" placeholder="${esc(b.ph2||'')}" oninput="setCampo('b_${b.id}_u',this.value)"></div></div></div>`;

      else if(b.tipo==='interrup') h=`<div class="campo"><label><span class="cod">${b.id}</span>${b.t}</label>
         <div class="pills">${['No','Sí'].map(o=>`<button class="pill ${R['b_'+b.id]===o?'sel '+(o==='Sí'?'si-alerta':'ok'):''}" onclick="setPill('b_${b.id}','${o}')">${o}</button>`).join('')}</div>

         </div>`;
      else h=cNum('b_'+b.id,b.t,b.u,b.hint,b.id);
      if(b.flags) h=h.replace(/<\/div>$/, cFlags('b_'+b.id,b.flags)+'</div>');
      return h;
    }).join('');
    return paso(`Números del negocio · ${desde+1}–${hasta} de 13`)+
     `<h2>${desde===0?'Cómo va el negocio':'Producción, pérdidas y tiempo'}</h2>
      <p class="ayuda">Son cantidades aproximadas de los últimos 30 días. Si no sabe, marcar NS; si prefiere no responder, NR. No poner cero por poner.</p>
      ${campos}`;

  const campos=BASE_POST.slice(desde,hasta).map(b=>{
    if(b.tipo==='canales'){
      return `<div class="campo"><label><span class="cod">${b.id}</span>${b.t}</label></div>

        </div></div>`;
    }
    return cNum('bp_'+b.id,b.t,b.u,b.hint,b.id);
  }).join('');
  return paso(`Números del negocio · ${desde+1}–${hasta} de 13`)+
   `<h2>${desde===0?'Cómo va el negocio ahora':'Producción, pérdidas, tiempo y ventas'}</h2>

function atras(){ if(idx>0){idx--;render();} }

/* ---------- Resultado ---------- */
function anillo(gen,color){
  const r=62,c=2*Math.PI*r;
  return `<div class="anillo-wrap"><div class="anillo">
    <svg width="150" height="150" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="13"/>
      <circle id="anillo-p" cx="75" cy="75" r="${r}" fill="none" stroke="${hexDe(color)}" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition:stroke-dashoffset 1.3s cubic-bezier(.4,0,.2,1)"/>
    </svg>
    <div class="num"><b>${gen!==null?gen.toFixed(2):'—'}</b><span>de 3,00</span></div>
  </div></div>`;
}
function renderResultado(){
  nav.style.display='none';
  $('#fab').style.display='flex';
  $('#barra-fill').style.width='100%';
  const pf=pref(), per=perfil(pf);
  const bajos=itemsBajos();

  let cards='',delay=0.12;
  per.dims.forEach((x,k)=>{
    const fb=FEEDBACK[x.dim.id][x.color];
    const dots=x.dim.items.map(it=>{
      const v=R[pf+it.id];
      const cls=(v===1||v===2||v===3)?'v'+v:'v0';
      const mk=v===3?'✓':v===2?'~':v===1?'✗':(v||'·');
      return `<span class="dot ${cls}">${mk} ${it.corto}</span>`;
    }).join('');
    cards+=`<div class="sem-card ${x.color}" style="animation-delay:${delay}s">
      <div class="sem-top"><div class="sem-luz ${x.color}">${x.dim.emoji}</div>
      <div><div class="sem-nombre">${x.dim.nombre}</div>
        <div class="sem-estado ${x.color}">${emojiDe(x.color)} ${textoDe(x.color)}${x.prom!==null?' · '+x.prom.toFixed(2)+' de 3':''}</div></div></div>
      <div class="dots">${dots}</div>
      <div class="panorama">${fb.msg}</div>
      <div class="acciones"><div class="a-tit">${x.color==='VERDE'?'Para seguir creciendo':x.color==='GRIS'?'Para completar':'Por dónde empezar'}</div>
        ${fb.acc.map(a=>`<div class="reco"><span>→</span><span>${a}</span></div>`).join('')}
      </div>
    </div>`;
    delay+=0.1;
  });

  let bloqueLogros='';
  if(fase==='expost'){
    const lg=[];
    if(R.au3==='Más') lg.push('💪 Ahora maneja más su propio dinero');
    if(R.au5==='Sí') lg.push('🏦 Puede ahorrar y decidir en qué usar sus ganancias');
    if(R.au4==='Bajó') lg.push('⏱️ Bajó su carga de trabajo y de cuidado');
    const mas=(R.bp_B10_mas||[]);
    if(mas.length) lg.push('🛍️ Hoy vende sobre todo por: '+mas.join(', '));
    if(lg.length) bloqueLogros=`<div class="logros"><h3>Para destacar</h3>
      ${lg.map(x=>`<div class="logro"><span>${x.slice(0,2)}</span><span>${esc(x.slice(2))}</span></div>`).join('')}</div>`;
  }
  const menor=per.dims.filter(x=>x.prom!==null).sort((a,b)=>a.prom-b.prom)[0];
  const msj = fase==='expost'
    ? 'Así está su negocio al cierre del acompañamiento. Conversar los resultados con ella antes de guardar.'
    : 'Este es el punto de partida. Explicarle cada color con sus palabras y en qué se va a trabajar.';

  main.innerHTML=`<div class="pantalla">
    <h2 class="centrado" style="margin-top:4px">${fase==='exante'?'Semáforo de su negocio':'Semáforo final'}<br><span style="font-weight:700;font-size:16px;color:var(--prim-osc)">${esc(sel.emp.emprendimiento||sel.emp.codigo)}</span></h2>
    ${anillo(per.general,per.colorGeneral)}
    <p class="centrado" style="margin:2px 0 14px"><span class="sem-estado ${per.colorGeneral}" style="font-size:14px">${emojiDe(per.colorGeneral)} ${textoDe(per.colorGeneral)}</span></p>
    ${bloqueLogros}
    ${menor?`<div class="nota"><b>Donde más se necesita apoyo:</b> ${menor.dim.nombre} (${menor.prom.toFixed(2)}).${bajos.length?` Hay ${bajos.length} pregunta(s) en el nivel más bajo para conversar con calma.`:''}</div>`:''}
    ${cards}
    <p class="msj-final">${msj}</p>
    <div id="zona-envio">
      <button class="btn btn-g" style="width:100%;margin-top:10px" onclick="enviar()">💾 Guardar ficha</button>
      <button class="btn btn-s" style="width:100%;margin-top:10px" onclick="volverRevisar()">← Revisar respuestas</button>
    </div>
    <p class="mini">${esc(sel.emp.codigo)} · ${fase==='exante'?'Ficha inicial':'Ficha final'} · ${hoy()} · Aplicó: ${esc(nombreAplica())} · v${VERSION_INSTRUMENTO}</p>
  </div>`;
  const c=2*Math.PI*62;
  const off=per.general!==null?c*(1-per.general/3):c;
  setTimeout(()=>{const el=document.getElementById('anillo-p');if(el)el.style.strokeDashoffset=off;},100);
  window.scrollTo(0,0);
}
function volverRevisar(){ idx=pasos.length-2; nav.style.display='block'; render(); }

/* ---------------- Envío ---------------- */
function armarPayload(){
  const pf=pref(), per=perfil(pf);
  const scores={}, evid={};
  DIMS.forEach(d=>d.items.forEach(it=>{ scores[it.id]=R[pf+it.id]??''; evid[it.id]=R['e_'+it.id]||''; }));
  const base={};
  if(fase==='exante') BASE_ANTE.forEach(b=>{
    if(b.tipo==='canales'){
      const of=R['b_'+b.id+'_of']||[], mas=R['b_'+b.id+'_mas']||[];
      base[b.id+'_ofrece']=of.join('; '); base[b.id+'_mas']=mas.join('; ');
      base[b.id]=of.length; base[b.id+'_mas_n']=mas.length;
      return;
    }
    base[b.id]=R['b_'+b.id]??'';
    if(R['b_'+b.id+'_a']!=null||R['b_'+b.id+'_b']!=null) base[b.id]=(R['b_'+b.id+'_a']??'')+' / '+(R['b_'+b.id+'_b']??'');
    if(R['b_'+b.id+'_f']) base[b.id]=R['b_'+b.id+'_f'];
    if(R['b_'+b.id+'_u']) base[b.id+'_u']=R['b_'+b.id+'_u'];
    if(R['b_'+b.id+'_d']!=null) base[b.id+'_dias']=R['b_'+b.id+'_d'];
    if(R['b_'+b.id+'_p']!=null) base[b.id+'_perdida']=R['b_'+b.id+'_p'];
  });
  else BASE_POST.forEach(b=>{
    if(b.tipo==='canales'){
      const of=R['bp_'+b.id+'_of']||[], mas=R['bp_'+b.id+'_mas']||[];
      base[b.id+'_ofrece']=of.join('; '); base[b.id+'_mas']=mas.join('; ');
      base[b.id]=of.length; base[b.id+'_mas_n']=mas.length;
      return;
    }
    base[b.id]=R['bp_'+b.id]??'';
    if(b.dual) base[b.id]=(R['bp_'+b.id+'_a']??'')+' / '+(R['bp_'+b.id+'_b']??'');
  });
  const dimsOut={};
  per.dims.forEach(x=>{ dimsOut[x.dim.id]={nombre:x.dim.nombre,oficial:x.dim.oficial,
    validos:x.validos,total:x.total,prom:x.prom,color:x.color}; });
  const menor=per.dims.filter(x=>x.prom!==null).sort((a,b)=>a.prom-b.prom)[0];
  const p={
    fase, version:VERSION_INSTRUMENTO,
    fecha:new Date().toISOString(), fecha_local:hoy(),
    codigo:sel.emp.codigo,
    aplica_apellidos:sel.apellidos||'', aplica_nombres:sel.nombres||'', mentora:nombreAplica(),
    emprendimiento:sel.emp.emprendimiento||'',
    emprendedora_apellidos:R.em_apellidos||sel.emp.apellidos||'',
    emprendedora_nombres:R.em_nombres||sel.emp.nombres||'',
    apellidos:sel.emp.apellidos||'', nombres:sel.emp.nombres||'',
    municipio:sel.emp.municipio||'', rubro:sel.emp.rubro||'',
    consentimiento:{acepta:R.cons_acepta||'',contacto:R.cons_contacto||''},
    identificacion:{direccion:R.id_zona||'',telefono:R.id_tel||''},
    base, scores, evidencias:evid, dimensiones:dimsOut,
    proms:per.dims.map(x=>x.prom), colores:per.dims.map(x=>x.color), validos:per.dims.map(x=>x.validos),
    general:per.general, color_general:per.colorGeneral,
    dimension_menor:menor?menor.dim.nombre:'',
    items_nivel1:itemsBajos().map(c=>c.item.id).join('; '),
    respuestas:R
  };
  if(fase==='expost'){
    p.factores=R.factores||'';
    p.autonomia={};PREG_AUTON.forEach(q=>{p.autonomia[q.id]={pregunta:q.t,respuesta:R[q.id]||'',detalle:R[q.id+'_e']||''};});
    p.valoracion={};ITEMS_VALOR.forEach(v=>{p.valoracion[v.id]={item:v.t,valor:R[v.id]??'',comentario:R[v.id+'_c']||''};});
  }
  return p;
}
async function enviar(){
  const z=$('#zona-envio'), payload=armarPayload();
  if(!API_URL){
    z.innerHTML=`<div class="ok-envio">✅ Ficha registrada en modo prueba (no se envió a la base).</div>
    <button class="btn btn-s" style="width:100%" onclick="descargarRespaldo()">⬇️ Descargar respaldo</button>
    <button class="btn btn-p" style="width:100%;margin-top:10px" onclick="finalizar()">Terminar</button>`;
    return;
  }
  z.innerHTML='<div class="ok-envio" style="background:var(--lila);color:var(--prim-osc)"><span class="spinner" style="border-top-color:var(--prim);border-color:rgba(167,139,250,.35)"></span> Enviando…</div>';

  /* 1) Envio normal: da respuesta inmediata cuando el navegador lo permite */
  try{
    const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(payload)});
    const j=await r.json();
    if(j.status==='ok'){ exitoEnvio(z); return; }
    if(j.status==='duplicado'){ duplicadoEnvio(z); return; }
    throw new Error(j.mensaje||'error');
  }catch(e){ /* sigue al plan B */ }

  /* 2) Plan B: se envia sin leer la respuesta y luego se confirma con la base */
  z.innerHTML='<div class="ok-envio" style="background:var(--lila);color:var(--prim-osc)"><span class="spinner" style="border-top-color:var(--prim);border-color:rgba(167,139,250,.35)"></span> Enviando y confirmando…</div>';
  try{
    await fetch(API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
  }catch(e){ colaFallo(z,payload); return; }

  await new Promise(r=>setTimeout(r,2500));
  let guardada=await verificarGuardada(payload.codigo,payload.fase);
  if(guardada===false){ await new Promise(r=>setTimeout(r,3500)); guardada=await verificarGuardada(payload.codigo,payload.fase); }

  if(guardada===true){ exitoEnvio(z); }
  else if(guardada===false){ colaFallo(z,payload,'La base no registró la ficha.'); }
  else {
    guardarCola(payload);
    z.innerHTML=`<div class="alerta">📤 La ficha se envió, pero no se pudo confirmar por falta de señal.<br>
    Quedó guardada en este dispositivo por seguridad: entra a ⚙️ más tarde y presiona <b>Enviar ahora</b>.</div>
    <button class="btn btn-p" style="width:100%" onclick="reintentarCola()">🔄 Reintentar</button>
    <button class="btn btn-s" style="width:100%;margin-top:10px" onclick="descargarRespaldo()">⬇️ Descargar respaldo</button>
    <button class="btn btn-s" style="width:100%;margin-top:10px" onclick="finalizar()">Terminar</button>`;
  }
}
function exitoEnvio(z){
  limpiarDraft();
  z.innerHTML=`<div class="ok-envio">✅ Ficha guardada en la base de datos.</div>
  <button class="btn btn-p" style="width:100%" onclick="finalizar()">Terminar</button>`;
}
function duplicadoEnvio(z){
  z.innerHTML=`<div class="err-envio">⚠️ Este emprendimiento ya tiene una ficha ${fase==='exante'?'inicial':'final'} registrada. No se guardó de nuevo.</div>
  <button class="btn btn-s" style="width:100%" onclick="descargarRespaldo()">⬇️ Descargar respaldo</button>
  <button class="btn btn-p" style="width:100%;margin-top:10px" onclick="finalizar()">Terminar</button>`;
}
function colaFallo(z,payload,motivo){
  guardarCola(payload);
  z.innerHTML=`<div class="err-envio">📶 No se pudo guardar${motivo?': '+motivo:''}. La ficha quedó en este dispositivo.</div>
  <button class="btn btn-p" style="width:100%" onclick="reintentarCola()">🔄 Reintentar envío</button>
  <button class="btn btn-s" style="width:100%;margin-top:10px" onclick="descargarRespaldo()">⬇️ Descargar respaldo</button>
  <button class="btn btn-s" style="width:100%;margin-top:10px" onclick="finalizar()">Terminar por ahora</button>`;
}
function guardarCola(p){
  const cola=JSON.parse(localStorage.getItem(LSKEY_COLA)||'[]');cola.push(p);
  localStorage.setItem(LSKEY_COLA,JSON.stringify(cola));
}
async function reintentarCola(){
  const cola=JSON.parse(localStorage.getItem(LSKEY_COLA)||'[]');
  if(!cola.length){finalizar();return;}
  let restantes=[];
  for(const p of cola){
    let ok=false;
    try{
      const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(p)});
      const j=await r.json();
      ok=(j.status==='ok'||j.status==='duplicado');
    }catch(e){
      try{
        await fetch(API_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(p)});
        await new Promise(r=>setTimeout(r,2500));
        ok=(await verificarGuardada(p.codigo,p.fase))===true;
      }catch(e2){ ok=false; }
    }
    if(!ok) restantes.push(p);
  }
  localStorage.setItem(LSKEY_COLA,JSON.stringify(restantes));
  const z=$('#zona-envio');
  if(!restantes.length){ limpiarDraft(); if(z)z.innerHTML=`<div class="ok-envio">✅ Todas las fichas pendientes se enviaron.</div><button class="btn btn-p" style="width:100%" onclick="finalizar()">Terminar</button>`; }
  else if(z){ const e=z.querySelector('.err-envio'); if(e)e.textContent='📶 Aún sin señal ('+restantes.length+' pendiente/s).'; }
}
function descargarRespaldo(){
  const p=armarPayload();
  const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='F360_'+p.fase+'_'+p.codigo+'.json';a.click();
}
function finalizar(){ limpiarDraft(); irInicio(); }

/* ---------------- Configuración ---------------- */
function irConfig(){
  nav.style.display='none';$('#fab').style.display='none';
  window._paso=null;
  const cola=JSON.parse(localStorage.getItem(LSKEY_COLA)||'[]');
  main.innerHTML=`<div class="pantalla">
    <h2>⚙️ Configuración</h2>
    <p class="ayuda">Solo el equipo técnico necesita esta pantalla.</p>
    <label class="lbl">URL del Apps Script (base de datos en Drive)</label>
    <input type="text" id="cfg-url" value="${esc(API_URL)}" placeholder="https://script.google.com/macros/s/…/exec">
    <button class="btn btn-p" style="width:100%;margin-top:14px" onclick="probarConexion()">🔌 Probar y guardar</button>
    <div id="cfg-msj"></div>
    ${cola.length?`<div class="alerta">📥 Hay ${cola.length} ficha(s) pendientes de envío en este dispositivo.<br><button class="btn btn-p" style="width:100%;margin-top:8px" onclick="reintentarColaCfg()">🔄 Enviar ahora</button></div>`:''}
    <button class="btn btn-s" style="width:100%;margin-top:16px" onclick="irInicio()">← Volver al inicio</button>
    <p class="mini">Consultoría IFFI–IPEE (UNIFRANZ) · Instrumento v${VERSION_INSTRUMENTO}</p>
  </div>`;
}
async function probarConexion(){
  const url=$('#cfg-url').value.trim(), m=$('#cfg-msj');
  if(!url){API_URL='';localStorage.removeItem(LSKEY_URL);
    m.innerHTML='<div class="alerta">Modo prueba activado (sin base de datos).</div>';return;}
  m.innerHTML='<div class="alerta">Probando conexión…</div>';
  const anterior=API_URL; API_URL=url;
  try{
    const j=await jsonp('action=ping',15);
    if(j&&j.status==='ok'){
      localStorage.setItem(LSKEY_URL,url);
      m.innerHTML='<div class="ok-envio">✅ Conexión exitosa. La app puede leer y escribir en la base.</div>';
    } else throw new Error('respuesta inesperada');
  }catch(e){
    API_URL=anterior;
    m.innerHTML='<div class="err-envio">❌ No se pudo conectar. Verifique la URL (debe terminar en /exec), que el script esté publicado para «Cualquier persona» y que haya internet.</div>';
  }
}
async function reintentarColaCfg(){ await reintentarCola(); irConfig(); }

irInicio();
</script>
